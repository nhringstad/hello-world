<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple Hello World access test.">
  <title>Hello World</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#101827;color:#f8fafc;font:18px/1.6 system-ui,sans-serif;padding:24px}main{text-align:center;max-width:620px}.badge{display:inline-block;background:#163d35;color:#8bf0c4;border:1px solid #2a6654;border-radius:999px;padding:6px 16px;font-size:14px}h1{font-size:clamp(48px,10vw,80px);line-height:1.1;letter-spacing:-.05em;margin:24px 0 16px}p{color:#b7c5d8;margin:0 0 28px}button{font:inherit;font-weight:600;background:#a9c5ff;color:#13203b;border:0;border-radius:12px;padding:12px 24px;cursor:pointer}button:hover{background:#c5d8ff}button:focus-visible{outline:3px solid white;outline-offset:5px}#result{min-height:30px;color:#8bf0c4;margin-top:18px}
  </style>
</head>
<body>
  <main>
    <span class="badge">Page loaded successfully</span>
    <h1>Hello, world.</h1>
    <p>You made it. This is your quick access test.</p>
    <button type="button" onclick="document.getElementById('result').textContent='Click received. Everything is working!'">Test interaction</button>
    <div id="result" role="status" aria-live="polite"></div>
  </main>
</body>
</html>
